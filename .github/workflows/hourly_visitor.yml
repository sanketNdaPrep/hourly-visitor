name: Hourly Website Visitor

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at minute 0 of every hour
  workflow_dispatch:      # Allows manual execution anytime

jobs:
  visit_website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Script
        env:
          TARGET_URL: 'https://earth-sp-nda.vercel.app/' # Replace with your target URL
          DWELL_TIME: '300'
        run: |
          python hourly_visitor.py
